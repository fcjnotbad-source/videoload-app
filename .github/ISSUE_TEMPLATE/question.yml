name: Ask a question / 使用咨询
description: Need help with the app? / 对使用方法有疑问？
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: "Please check the FAQ first. This question is public; never post receipts, credentials or private media. / 请先查看常见问题；咨询内容公开可见，请勿提交购买凭据、账号信息或私人媒体。"
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Android · Google Play
        - Android · Direct APK / 官网直装
        - iPhone
        - Not installed yet / 尚未安装
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, if installed / 应用版本（如已安装）
  - type: textarea
    id: question
    attributes:
      label: Your question / 你的问题
    validations:
      required: true
